<template>
  <div class={lcdClass}>
    <div class="status-bar" aria-hidden="true">
      <span class="score">{score}</span>
      <span class="speed">x{displaySpeed}</span>
      <span class="high-score">HI {highScoreLabel}</span>
    </div>
    <div
      class="field"
      aria-hidden="true"
      onpointerdown={handlePointerDown}
      onpointerup={handlePointerUp}
      onpointercancel={handlePointerCancel}
    >
      <template for:each={segments} for:item="segment">
        <div key={segment.key} class={segment.className} style={segment.style}></div>
      </template>
      <template lwc:if={food}>
        <div class="cell food" style={food.style}></div>
      </template>
      <template lwc:if={message}>
        <div class="message">
          <p class="message-title">{message.title}</p>
          <template lwc:if={isGameOver}>
            <p class="message-score">
              Score {state.score}<template lwc:if={newHighScore}> &middot; New record!</template>
            </p>
          </template>
          <p class="message-text">{message.text}</p>
          <template lwc:if={message.hint}>
            <p class="message-hint">{message.hint}</p>
          </template>
        </div>
      </template>
    </div>
    <div class="soft-labels" aria-hidden="true">
      <span>{selectLabel}</span>
      <span>{backLabel}</span>
    </div>
    <p class="assistive-text" aria-live="polite">{announcement}</p>
    <p class="assistive-text">Score {state.score}, high score {highScore}</p>
  </div>
</template>
