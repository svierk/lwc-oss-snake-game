name: Validation

# Validates changes to this repository: checks formatting and linting, runs the
# LWC unit tests and builds the production bundle of the LWR site. The workflow
# needs no secrets, so pull requests from forks are validated the same way as
# pushes to `main`.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least-privilege token: this workflow only reads the repository.
permissions:
  contents: read

jobs:
  # The job name is the context of the required status check on `main`
  # (repository ruleset "main") - renaming it means updating that ruleset too.
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false # the GITHUB_TOKEN is not needed after the checkout - don't leave it in .git/config

      # NODE_VERSION_OVERRIDE is a repository variable; unset it to fall back
      # to engines.node from package.json, populate it to pin a version
      # without touching this workflow file. The action detects Yarn from
      # package.json#packageManager and enables Corepack before the Node.js
      # setup, so that this Yarn version is used for the dependency cache.
      - name: Select Node Version
        uses: svierk/get-node-version@v1.6.0
        with:
          node-version: ${{ vars.NODE_VERSION_OVERRIDE }}

      # --immutable fails the build if the install would change yarn.lock
      # instead of silently resolving to different versions than reviewed.
      - name: Install Dependencies
        run: yarn install --immutable

      # Building block of the Salesforce DevOps Starter Kit. The Code Analyzer
      # needs the Salesforce CLI and is switched off - this is an LWC OSS
      # project, not an SFDX one - so only the Prettier and ESLint checks run,
      # through the scripts in package.json.
      - name: Code Review
        uses: svierk/sfdx-code-review@v1.1.0
        with:
          code-analyzer: false
          prettier: true
          prettier-command: yarn run prettier:verify
          eslint: true
          # lint:sonar writes the JSON report the action counts errors and
          # warnings from, but prints nothing readable - on failure, rerun with
          # the default formatter so the findings show up in the log.
          eslint-command: yarn run lint:sonar || yarn run lint

      # Building block of the Salesforce DevOps Starter Kit. Apex and Flow tests
      # need an org and are switched off; the LWC tests write the lcov report
      # the action reads the coverage for the job summary from.
      - name: LWC Unit Tests
        uses: svierk/sfdx-run-tests@v1.2.0
        with:
          apex: false
          lwc: true
          lwc-test-command: yarn run test:unit:coverage

      - name: Build Production Bundle
        run: yarn run build
